<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HS Control - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Urbanist:wght@800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:#08080a;color:#f5f5f5;font-family:'Cairo',sans-serif;padding:20px;min-height:100vh}
        header{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #1a1a24}
        .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#deff9a,#2a9d8f);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Urbanist',sans-serif;font-size:16px;font-weight:800;color:#000}
        h1{font-family:'Urbanist',sans-serif;font-size:18px;font-weight:800}
        h1 span{color:#deff9a}
        .card{background:#101014;border:1px solid #1a1a24;border-radius:12px;padding:16px;margin-bottom:16px}
        .card-title{font-size:13px;font-weight:bold;color:#deff9a;margin-bottom:14px;display:flex;align-items:center;gap:6px}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .inp-group label{display:block;font-size:10px;color:#666;margin-bottom:4px}
        .inp-group input, .inp-group select{width:100%;background:#0d0d10;border:1px solid #2d2d3d;border-radius:7px;color:#fff;padding:8px 10px;font-size:12px;outline:none;font-family:'Cairo',sans-serif}
        .inp-group input:focus{border-color:#deff9a}
        .btn-gen{background:#deff9a;color:#000;border:none;border-radius:8px;padding:10px 16px;font-weight:800;font-size:13px;cursor:pointer;width:100%;margin-top:10px}
        .btn-gen:active{background:#c8f060}
        .code-display{background:#0d0d10;border:2px solid #deff9a;border-radius:10px;padding:14px;text-align:center;font-family:'Urbanist',sans-serif;font-size:22px;font-weight:800;color:#deff9a;letter-spacing:3px;margin-top:10px;display:none;cursor:pointer}
        .code-display small{display:block;font-size:10px;color:#888;margin-top:4px;font-family:'Cairo',sans-serif;letter-spacing:0}
        .licenses-list{display:flex;flex-direction:column;gap:8px}
        .lic-item{background:#0d0d10;border:1px solid #1a1a24;border-radius:8px;padding:10px;display:flex;justify-content:space-between;align-items:center}
        .lic-info{font-size:11px}
        .lic-code{font-family:'Urbanist',sans-serif;font-size:13px;font-weight:800;color:#deff9a}
        .lic-name{color:#aaa;margin-top:2px}
        .lic-expiry{font-size:10px;color:#666}
        .lic-status{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:bold}
        .lic-status.active{background:#2a9d8f22;color:#2a9d8f;border:1px solid #2a9d8f}
        .lic-status.expired{background:#e6394622;color:#e63946;border:1px solid #e63946}
        .lic-status.inactive{background:#44444422;color:#888;border:1px solid #444}
        .lic-badge.trial{display:inline-block;font-size:9px;padding:2px 7px;border-radius:4px;font-weight:bold;background:#ffd70022;color:#ffd700;border:1px solid #ffd700;margin-inline-start:6px}
        .btn-toggle{font-size:10px;padding:4px 8px;border-radius:5px;cursor:pointer;border:1px solid #2d2d3d;background:#1c1c24;color:#aaa;margin-top:4px}
        .btn-toggle:active{background:#2a2a35}
        .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
        .stat{background:#101014;border:1px solid #1a1a24;border-radius:10px;padding:12px;text-align:center}
        .stat-num{font-family:'Urbanist',sans-serif;font-size:24px;font-weight:800;color:#deff9a}
        .stat-label{font-size:10px;color:#666;margin-top:2px}
        .loading{text-align:center;color:#555;padding:20px;font-size:12px}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#121216;border:1px solid #deff9a;color:#fff;padding:10px 20px;border-radius:8px;font-size:12px;display:none;z-index:999}
        .loginScreen{position:fixed;inset:0;background:#08080a;display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
        .loginCard{background:#101014;border:1px solid #1a1a24;border-radius:14px;padding:24px;width:100%;max-width:320px}
        .loginCard .logo-icon{margin:0 auto 14px}
        .loginCard h2{text-align:center;font-size:15px;margin-bottom:18px;color:#f5f5f5}
        .loginCard input{width:100%;background:#0d0d10;border:1px solid #2d2d3d;border-radius:8px;color:#fff;padding:10px 12px;font-size:13px;outline:none;font-family:'Cairo',sans-serif;margin-bottom:10px}
        .loginCard input:focus{border-color:#deff9a}
        .loginCard .btn-gen{margin-top:4px}
        .loginError{color:#e63946;font-size:11px;text-align:center;margin-top:10px;display:none}
        .dashboard{display:none}
        .dashboard.show{display:block}
        .logoutBar{display:flex;justify-content:flex-end;margin-bottom:10px}
        .btn-logout{background:#1c1c24;color:#aaa;border:1px solid #2d2d3d;border-radius:7px;padding:6px 12px;font-size:11px;cursor:pointer}
    </style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div class="loginScreen" id="loginScreen">
    <div class="loginCard">
        <div class="logo-icon">HS</div>
        <h2>تسجيل الدخول للوحة التحكم</h2>
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" autocomplete="username">
        <input type="password" id="loginPassword" placeholder="كلمة المرور" autocomplete="current-password">
        <button class="btn-gen" onclick="window.doLogin()">دخول</button>
        <div class="loginError" id="loginError"></div>
    </div>
</div>

<div class="dashboard" id="dashboard">
<div class="logoutBar"><button class="btn-logout" onclick="window.doLogout()">🚪 خروج</button></div>
<header>
    <div class="logo-icon">HS</div>
    <div>
        <h1>Hesham <span>Saad</span> Control</h1>
        <div style="font-size:10px;color:#555">لوحة إدارة التراخيص</div>
    </div>
</header>

<!-- إحصائيات -->
<div class="stats">
    <div class="stat"><div class="stat-num" id="statTotal">-</div><div class="stat-label">إجمالي</div></div>
    <div class="stat"><div class="stat-num" id="statActive" style="color:#2a9d8f">-</div><div class="stat-label">نشط</div></div>
    <div class="stat"><div class="stat-num" id="statExpired" style="color:#e63946">-</div><div class="stat-label">منتهي</div></div>
</div>

<!-- إنشاء ترخيص جديد -->
<div class="card">
    <div class="card-title">➕ إنشاء ترخيص جديد</div>
    <div class="form-grid">
        <div class="inp-group">
            <label>اسم العميل</label>
            <input type="text" id="newName" placeholder="اسم الاستوديو">
        </div>
        <div class="inp-group">
            <label>تاريخ الانتهاء</label>
            <input type="date" id="newExpiry">
        </div>
    </div>
    <div class="form-grid" style="margin-top:10px">
        <div class="inp-group">
            <label>نوع الاشتراك</label>
            <select id="newType" onchange="window.updateExpiry()">
                <option value="trial14">🎁 تجربة مجانية (أسبوعين)</option>
                <option value="1month">شهري (30 يوم)</option>
                <option value="3month">3 شهور</option>
                <option value="1year">سنوي</option>
                <option value="lifetime">مدى الحياة</option>
                <option value="custom">تاريخ مخصص</option>
            </select>
        </div>
        <div class="inp-group">
            <label>كود مخصص (اختياري)</label>
            <input type="text" id="customCode" placeholder="تلقائي">
        </div>
        <div class="inp-group">
            <label>المنتج</label>
            <select id="newProduct">
                <option value="control">HS Control</option>
                <option value="replay">HS Replay</option>
            </select>
        </div>
    </div>
    <button class="btn-gen" onclick="window.generateLicense()">⚡ إنشاء الكود</button>
    <div class="code-display" id="codeDisplay" onclick="window.copyCode()">
        <div id="codeText"></div>
        <small>اضغط للنسخ</small>
    </div>
</div>

<!-- قائمة التراخيص -->
<div class="card">
    <div class="card-title">📋 التراخيص الموجودة</div>
    <div class="licenses-list" id="licensesList">
        <div class="loading">جاري التحميل...</div>
    </div>
</div>

<div class="toast" id="toast"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEHC-dIxkxbh-S8vDm5IhjSGJgPYOL1pU",
        authDomain: "heshamsaad-b54c1.firebaseapp.com",
        projectId: "heshamsaad-b54c1",
        storageBucket: "heshamsaad-b54c1.firebasestorage.app",
        messagingSenderId: "820117279250",
        appId: "1:820117279250:web:3f8353e291d7f10e787ecb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.doLogin = function() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errEl = document.getElementById('loginError');
        errEl.style.display = 'none';
        if (!email || !password) {
            errEl.innerText = 'اكتب الإيميل وكلمة المرور';
            errEl.style.display = 'block';
            return;
        }
        signInWithEmailAndPassword(auth, email, password).catch((e) => {
            errEl.innerText = 'بيانات الدخول غلط أو الحساب مش موجود';
            errEl.style.display = 'block';
        });
    };

    window.doLogout = function() {
        signOut(auth);
    };

    onAuthStateChanged(auth, (user) => {
        const loginScreen = document.getElementById('loginScreen');
        const dashboard = document.getElementById('dashboard');
        if (user) {
            loginScreen.style.display = 'none';
            dashboard.classList.add('show');
            window.loadLicenses();
        } else {
            loginScreen.style.display = 'flex';
            dashboard.classList.remove('show');
        }
    });

    window.showToast = function(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2500);
    };

    function generateCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const part = (n) => Array.from({length:n}, ()=>chars[Math.floor(Math.random()*chars.length)]).join('');
        return `HS-${part(4)}-${part(4)}`;
    }

    window.updateExpiry = function() {
        const type = document.getElementById('newType').value;
        const today = new Date();
        let expiry;
        if(type === 'trial14') { today.setDate(today.getDate() + 14); expiry = today; }
        else if(type === '1month') { today.setDate(today.getDate() + 30); expiry = today; }
        else if(type === '3month') { today.setMonth(today.getMonth() + 3); expiry = today; }
        else if(type === '1year') { today.setFullYear(today.getFullYear() + 1); expiry = today; }
        else if(type === 'lifetime') { expiry = new Date('2099-12-31'); }
        else { return; }
        document.getElementById('newExpiry').value = expiry.toISOString().split('T')[0];
    };

    window.loadLicenses = async function() {
        const list = document.getElementById('licensesList');
        try {
            const snap = await getDocs(collection(db, 'licenses'));
            const today = new Date().toISOString().split('T')[0];
            let total = 0, active = 0, expired = 0;
            let html = '';

            snap.forEach(d => {
                const data = d.data();
                const id = d.id;
                total++;
                const isExpired = data.expiry < today;
                const status = !data.active ? 'inactive' : isExpired ? 'expired' : 'active';
                const statusText = !data.active ? 'موقوف' : isExpired ? 'منتهي' : 'نشط';
                if(status === 'active') active++;
                if(status === 'expired') expired++;
                const isTrial = data.plan === 'trial14';
                const prodBadge = data.product === 'replay' ? '<span class="lic-badge trial" style="color:#c8ee3a;border-color:#c8ee3a;background:#c8ee3a22">▶ Replay</span>' : '';
                const trialBadge = isTrial ? '<span class="lic-badge trial">🎁 تجربة</span>' : '';

                html += `<div class="lic-item">
                    <div class="lic-info">
                        <div class="lic-code">${id}${trialBadge}${prodBadge}</div>
                        <div class="lic-name">${data.name || ''}</div>
                        <div class="lic-expiry">ينتهي: ${data.expiry || ''}</div>
                        <button class="btn-toggle" onclick="window.toggleLicense('${id}', ${data.active})">${data.active ? 'إيقاف' : 'تفعيل'}</button>
                    </div>
                    <div class="lic-status ${status}">${statusText}</div>
                </div>`;
            });

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statActive').innerText = active;
            document.getElementById('statExpired').innerText = expired;
            list.innerHTML = html || '<div class="loading">لا يوجد تراخيص</div>';
        } catch(e) {
            console.error(e);
            list.innerHTML = '<div class="loading">خطأ في الاتصال بقاعدة البيانات</div>';
        }
    };

    window.generateLicense = async function() {
        const name = document.getElementById('newName').value.trim();
        const expiry = document.getElementById('newExpiry').value;
        const custom = document.getElementById('customCode').value.trim().toUpperCase();
        const plan = document.getElementById('newType').value;

        if(!name) { window.showToast('❌ أدخل اسم العميل'); return; }
        if(!expiry) { window.showToast('❌ اختار تاريخ الانتهاء'); return; }

        const code = custom || generateCode();

        try {
            await setDoc(doc(db, 'licenses', code), {
                name: name,
                active: true,
                expiry: expiry,
                plan: plan,
                product: document.getElementById('newProduct').value,
                device_id: 'any',
                created_at: new Date().toISOString()
            });

            document.getElementById('codeText').innerText = code;
            document.getElementById('codeDisplay').style.display = 'block';
            document.getElementById('newName').value = '';
            document.getElementById('customCode').value = '';
            window.showToast('✅ تم إنشاء الكود!');
            window.loadLicenses();
        } catch(e) {
            console.error(e);
            window.showToast('❌ خطأ أثناء حفظ البيانات');
        }
    };

    window.copyCode = function() {
        const code = document.getElementById('codeText').innerText;
        navigator.clipboard.writeText(code).then(() => window.showToast('✅ تم نسخ الكود!'));
    };

    window.toggleLicense = async function(id, currentActive) {
        try {
            await updateDoc(doc(db, 'licenses', id), { active: !currentActive });
            window.showToast(currentActive ? '⏸ تم إيقاف الترخيص' : '▶️ تم تفعيل الترخيص');
            window.loadLicenses();
        } catch(e) {
            console.error(e);
            window.showToast('❌ حدث خطأ أثناء التحديث');
        }
    };

    window.updateExpiry();
</script>
</body>
</html>
